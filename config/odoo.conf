[options]
; db credentials come from the compose environment, not from here.
addons_path = /mnt/extra-addons/core-addons,/mnt/extra-addons/pimrypie-addons
data_dir = /var/lib/odoo
; Master password for the database manager. Inert here: list_db = False makes
; every db management function raise AccessDenied before it is ever checked
; (odoo/service/db.py, check_db_management_enabled). Keep a placeholder in git
; and never commit a real one -- this file is tracked.
admin_passwd = CHANGE_ME_master_password

; central shared DB: never expose create/drop/backup from the web UI
list_db = False

; one http worker + cron is enough for a playground.
; ponytail: workers=0 means no gevent longpolling; raise to 2+ if you add
; a module that uses the bus (chatter live updates, discuss).
workers = 0
max_cron_threads = 1

log_level = info
