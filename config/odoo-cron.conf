[options]
; Config for the cron-only container, started with:
;   docker compose --profile cron up -d
; The web container keeps config/odoo.conf. Only http_enable and
; max_cron_threads really differ; everything else is kept identical on purpose,
; so a job behaves the same whichever container happens to run it.

; db credentials come from the compose environment, not from here.
addons_path = /mnt/extra-addons/core-addons,/mnt/extra-addons/pimrypie-addons
data_dir = /var/lib/odoo

; This container answers no requests. No http means no session store, no
; assets, no login: it exists only to run ir.cron jobs.
http_enable = False

; The whole point of the split. Set WEB_CRON_THREADS=0 in .env at the same
; time, or both containers keep polling ir_cron. They will not double-run a
; job -- ir_cron claims rows with FOR NO KEY UPDATE SKIP LOCKED -- but the web
; workers would burn time on the poll for nothing.
max_cron_threads = 2

; central shared DB: never expose create/drop/backup. This container serves no
; UI, but list_db also gates odoo.service.db, so keep it in step with
; odoo.conf -- core_backup reads the same flag and works around it.
list_db = False

; no http here, so workers would only add cron-unrelated processes.
workers = 0

log_level = info
